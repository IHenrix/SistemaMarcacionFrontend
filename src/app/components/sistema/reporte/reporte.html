<form class="filters-section">
  <div class="filters-row">
    <div class="form-group-utp">
      <label class="label-utp" for="fecha-desde">Desde</label>
      <input id="fecha-desde" type="date" class="form-control-utp" />
    </div>
    <div class="form-group-utp">
      <label class="label-utp" for="fecha-hasta">Hasta</label>
      <input id="fecha-hasta" type="date" class="form-control-utp" />
    </div>
    <div class="form-group-utp">
      <label class="label-utp" for="tipo">Tipo</label>
      <select id="tipo" class="form-control-utp">
        <option value="">Todos</option>
        <option value="Presencial">Presencial</option>
        <option value="Remoto">Remoto</option>
      </select>
    </div>
    <div class="form-group-utp">
      <label class="label-utp" for="estado">Estado</label>
      <select id="estado" class="form-control-utp">
        <option value="">Todos</option>
        <option value="A tiempo">A tiempo</option>
        <option value="Tardanza">Tardanza</option>
        <option value="Falta">Falta</option>
      </select>
    </div>
  </div>
  <div class="filters-actions">
    <button class="btn-utp-green">
      <i class="fas fa-search"></i> Buscar
    </button>
    <button class="btn-utp-cyan">
      <i class="fas fa-eraser"></i> Limpiar
    </button>
    <button class="btn-utp-red">
      <i class="fas fa-file-export"></i> Exportar
    </button>
  </div>
</form>
