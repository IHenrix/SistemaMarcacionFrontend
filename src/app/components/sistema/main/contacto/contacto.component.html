<div class="contacto">
  <div class="contacto-content">
    <div class="contacto-title">
      <h1>FORMULARIO DE CONTACTO</h1>
      <button class="btn-return" [routerLink]="['/menu-principal']">
        <i class="fas fa-long-arrow-alt-left"></i>
        Regresar
      </button>
    </div>
    <form
      class="form-section"
      ngNoForm
      action="mailto:enrique.pdg@hotmail.com"
      method="post"
      enctype="text/plain"
    >
      <div class="form-row">
        <div class="form-group-utp">
          <label class="label-utp" for="nombre"> Nombre completo </label>
          <input
            id="nombre"
            type="text"
            class="form-control-utp"
            disabled
            value="Ricardo Enrique Prada Guerra"
            placeholder="Escribe tu nombre"
            name="nombre"
          />
        </div>

        <div class="form-group-utp">
          <label class="label-utp" for="email"> Correo electrónico </label>
          <input
            id="email"
            type="email"
            class="form-control-utp"
            value="enrique.pdg@hotmail.com"
            disabled
            name="email"
          />
        </div>

        <div class="form-group-utp">
          <label class="label-utp" for="telefono"> Teléfono </label>
          <input
            id="telefono"
            type="tel"
            class="form-control-utp"
            placeholder="Opcional"
            name="telefono"
            required
            pattern="[0-9+\s()-]{6,}"
            title="Ingresa un teléfono válido (mín. 6 caracteres, solo números, +, -, espacios o paréntesis)"
          />
        </div>

        <div class="form-group-utp">
          <label class="label-utp" for="tipo"> Tipo de solicitud </label>
          <select id="tipo" class="form-control-utp" name="tipo" required>
            <option value>Selecciona</option>
            <option value="Consulta">Consulta</option>
            <option value="Reclamo">Reclamo</option>
            <option value="Sugerencia">Sugerencia</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="form-group-utp form-group-utp--full">
          <label class="label-utp" for="asunto"> Asunto </label>
          <input
            id="asunto"
            type="text"
            class="form-control-utp"
            placeholder="Breve descripción del asunto"
            name="asunto"
            required
            minlength="5"
          />
        </div>

        <div class="form-group-utp form-group-utp--full">
          <label class="label-utp" for="emailOpcional"> Email </label>
          <input
            id="emailOpcional"
            type="email"
            class="form-control-utp"
            placeholder="Correo electrónico (opcional)"
            name="emailOpcional"
            required
            title="Ingresa un correo electrónico válido (ejemplo@dominio.com)"
          />
        </div>

        <div class="form-group-utp form-group-utp--full">
          <label class="label-utp" for="mensaje"> Mensaje </label>
          <textarea
            id="mensaje"
            rows="5"
            class="form-control-utp"
            placeholder="Describe tu consulta, reclamo o sugerencia"
            name="mensaje"
            required
            minlength="10"
          ></textarea>
        </div>

        <div class="form-group-utp form-group-utp--file">
          <label class="label-utp" for="adjunto">
            Adjuntar archivo (opcional)
          </label>
          <input
            id="adjunto"
            type="file"
            class="form-control-utp"
            name="adjunto"
            accept=".pdf,.jpg,.jpeg,.png"
          />
          <small class="help-text">Formatos: PDF, JPG o PNG (máx. 5MB)</small>
        </div>

        <div class="form-group-utp form-group-utp--full check-consent">
          <label class="checkbox-utp">
            <input type="checkbox" name="consent" required />
            <span>
              Acepto el uso de mis datos para gestionar mi solicitud.
            </span>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-utp-green">
          <i class="fas fa-paper-plane"></i>
          Enviar
        </button>
        <button type="reset" class="btn-utp-cyan">
          <i class="fas fa-eraser"></i>
          Limpiar
        </button>
        <button type="button" class="btn-utp-red">
          <i class="fas fa-file-export"></i>
          Exportar
        </button>
      </div>
    </form>

    <section class="media-container">
      <h2 class="media-title">Guías y Recursos</h2>

      <div class="media-grid">
        <figure class="media-card">
          <img src="/img/contacto/contacto.jpg" alt="Atención al usuario" />
          <figcaption>
            <a href="/archivo/contacto/guia-contacto.pdf" target="_blank">
              Abrir guía de contacto
            </a>
          </figcaption>
        </figure>

        <figure class="media-card">
          <audio controls>
            <source src="/audio/contacto.mp3" type="audio/mpeg" />
            Tu navegador no soporta audio HTML5.
          </audio>
          <figcaption>Audio: Indicaciones para reclamos</figcaption>
        </figure>

        <figure class="media-card">
          <video controls poster="/img/contacto/contacto2.png">
            <source src="/video/contacto/explicacion-contacto.mp4" type="video/mp4" />
            Tu navegador no soporta video HTML5.
          </video>
          <figcaption>Video: ¿Cómo enviar tu consulta?</figcaption>
        </figure>
      </div>
    </section>
  </div>
</div>
