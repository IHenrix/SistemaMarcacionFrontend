<div class="contacto-wrapper">
  <form class="form-section" #f="ngForm" (ngSubmit)="enviar(f)" novalidate>
    <div class="form-row">
      <div class="form-group-utp">
        <label class="label-utp" for="nombre">Nombre completo</label>
        <input
          id="nombre"
          name="nombre"
          type="text"
          class="form-control-utp"
          placeholder="Escribe tu nombre"
          [(ngModel)]="modelo.nombre"
          [readonly]="soloLecturaNombre"
          required
        />
      </div>

      <div class="form-group-utp">
        <label class="label-utp" for="email">Correo electronico</label>
        <input
          id="email"
          name="email"
          type="email"
          class="form-control-utp"
          placeholder="ejemplo@dominio.com"
          [(ngModel)]="modelo.email"
          [readonly]="soloLecturaEmail"
          required
        />
      </div>

      <div class="form-group-utp">
        <label class="label-utp" for="telefono">Telefono</label>
        <input
          id="telefono"
          name="telefono"
          type="tel"
          class="form-control-utp"
          placeholder="Ingresa tu telefono"
          [(ngModel)]="modelo.telefono"
          required
          pattern="[0-9 +()-]{6,}"
          title="Ingresa un telefono valido"
        />
      </div>

      <div class="form-group-utp">
        <label class="label-utp" for="tipo">Tipo de solicitud</label>
        <select
          id="tipo"
          name="tipo"
          class="form-control-utp"
          [(ngModel)]="modelo.tipo"
          required
        >
          <option value="">Selecciona</option>
          <option value="Consulta">Consulta</option>
          <option value="Reclamo">Reclamo</option>
          <option value="Sugerencia">Sugerencia</option>
          <option value="Otro">Otro</option>
        </select>
      </div>

      <div class="form-group-utp form-group-utp--full">
        <label class="label-utp" for="asunto">Asunto</label>
        <input
          id="asunto"
          name="asunto"
          type="text"
          class="form-control-utp"
          placeholder="Breve descripcion del asunto"
          [(ngModel)]="modelo.asunto"
          required
          minlength="5"
        />
      </div>

      <div class="form-group-utp form-group-utp--full">
        <label class="label-utp" for="mensaje">Mensaje</label>
        <textarea
          id="mensaje"
          name="mensaje"
          rows="5"
          class="form-control-utp"
          placeholder="Describe tu consulta, reclamo o sugerencia (minimo 10 caracteres)"
          [(ngModel)]="modelo.mensaje"
          required
          minlength="5"
        ></textarea>
      </div>

      <div class="form-group-utp form-group-utp--file">
        <label class="label-utp" for="adjunto">Adjuntar archivo (opcional)</label>
        <input
          #fileInput
          id="adjunto"
          type="file"
          class="form-control-utp"
          accept=".pdf,.jpg,.jpeg,.png"
          (change)="onFileChange($event)"
        />
        <small class="help-text">Formatos: PDF, JPG o PNG (max. 5MB)</small>
      </div>

      <div class="form-group-utp form-group-utp--full check-consent">
        <label class="checkbox-utp">
          <input type="checkbox" name="consentimiento" [(ngModel)]="consentimiento" required />
          <span>Acepto el uso de mis datos para gestionar mi solicitud.</span>
        </label>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-utp-green" [disabled]="f.invalid || cargando">
        <i class="fas fa-paper-plane"></i>
        Enviar
      </button>
      <button type="reset" class="btn-utp-cyan" (click)="fileInput.value=''; archivoSeleccionado=null">
        <i class="fas fa-eraser"></i>
        Limpiar
      </button>
    </div>
  </form>

  <section class="media-container">
    <h2 class="media-title">Guias y Recursos</h2>

    <div class="media-grid">
      <figure class="media-card">
        <img src="/img/contacto/contacto.jpg" alt="Atencion al usuario" />
        <figcaption>
          <a href="/archivo/contacto/guia-contacto.pdf" target="_blank">Abrir guia de contacto</a>
        </figcaption>
      </figure>

      <figure class="media-card">
        <audio controls>
          <source src="/audio/contacto.mp3" type="audio/mpeg" />
          Tu navegador no soporta audio HTML5.
        </audio>
        <figcaption>Audio: Indicaciones para reclamos</figcaption>
      </figure>

      <figure class="media-card">
        <video controls poster="/img/contacto/contacto2.png">
          <source src="/video/contacto/explicacion-contacto.mp4" type="video/mp4" />
          Tu navegador no soporta video HTML5.
        </video>
        <figcaption>Video: Como enviar tu consulta?</figcaption>
      </figure>
    </div>
  </section>
</div>
