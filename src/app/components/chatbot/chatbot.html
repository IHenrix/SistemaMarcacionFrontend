<!-- Botón flotante -->
<div class="chatbot-button" [class.chatbot-button-active]="isOpen" (click)="toggleChat()">
  @if (!isOpen) {
    <i class="fas fa-comments"></i>
  } @else {
    <i class="fas fa-times"></i>
  }
</div>

<!-- Panel del chat -->
@if (isOpen) {
  <div class="chatbot-panel">
    <!-- Header -->
    <div class="chatbot-header">
      <div class="chatbot-header-content">
        <i class="fas fa-robot"></i>
        <div class="chatbot-header-text">
          <h3>Asistente de Marcaciones</h3>
          <span class="chatbot-status">En línea</span>
        </div>
      </div>
      <button class="chatbot-close" (click)="toggleChat()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Mensajes -->
    <div class="chatbot-messages" #messagesContainer>
      @for (msg of messages; track msg.timestamp; let i = $index) {
        <div class="message-wrapper" [class.user-message]="msg.sender === 'user'" [class.bot-message]="msg.sender === 'bot'">
          <div class="message-bubble">
            <p>{{ msg.message }}</p>
            <span class="message-time">{{ formatTime(msg.timestamp) }}</span>
          </div>

          <!-- Botón de audio solo para mensajes del bot -->
          @if (msg.sender === 'bot') {
            <button
              class="audio-button"
              [class.audio-button-active]="speakingMessageIndex === i && isSpeaking"
              [class.audio-button-paused]="speakingMessageIndex === i && isPaused"
              [class.audio-button-loading]="speakingMessageIndex === i && isLoadingAudio"
              (click)="speakMessage(msg.message, i)"
              [disabled]="false"
              [title]="speakingMessageIndex === i ? (isLoadingAudio ? 'Cancelar' : (isSpeaking ? 'Pausar' : (isPaused ? 'Continuar' : 'Escuchar mensaje'))) : 'Escuchar mensaje'"
            >
              @if (speakingMessageIndex === i && isLoadingAudio) {
                <i class="fas fa-times"></i>
              } @else if (speakingMessageIndex === i && isSpeaking) {
                <i class="fas fa-pause"></i>
              } @else if (speakingMessageIndex === i && isPaused) {
                <i class="fas fa-play"></i>
              } @else {
                <i class="fas fa-volume-up"></i>
              }
            </button>
          }
        </div>
      }

      <!-- Indicador de escritura -->
      @if (isLoading) {
        <div class="message-wrapper bot-message">
          <div class="message-bubble typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      }
    </div>

    <!-- Input -->
    <div class="chatbot-input">
      <button
        class="chatbot-mic-button"
        [class.chatbot-mic-recording]="isRecording"
        (click)="toggleRecording()"
        [disabled]="isLoading"
        title="{{ isRecording ? 'Detener grabación' : 'Grabar mensaje de voz' }}"
      >
        @if (isRecording) {
          <i class="fas fa-stop-circle"></i>
        } @else {
          <i class="fas fa-microphone"></i>
        }
      </button>

      <div class="chatbot-input-wrapper">
        @if (isRecording) {
          <div class="recording-indicator">
            <span class="recording-dot"></span>
            <span class="recording-text">Escuchando... Habla ahora</span>
          </div>
        }
        <textarea
          [(ngModel)]="userInput"
          (input)="autoResize($event)"
          (keydown)="onKeyDown($event)"
          [disabled]="isLoading || isRecording"
          [placeholder]="isRecording ? '' : 'Escribe tu mensaje...'"
          class="chatbot-input-field"
          [class.chatbot-input-recording]="isRecording"
          rows="1"
          #textareaInput
        ></textarea>
      </div>

      <button
        (click)="sendMessage()"
        [disabled]="!userInput.trim() || isLoading"
        class="chatbot-send-button"
      >
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>
}
